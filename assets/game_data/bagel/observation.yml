# 镜头与位置观测参数，尚未经过独立角度标定。标准小地图为 201×201。
# 圆框检测不读取角色箭头；灰度差与角度覆盖率共同判定。
ring_inner_radius: 90
ring_outer_radius: 99
ring_min_mean_gradient: 16
ring_point_gradient: 12
ring_min_coverage: 0.7
# 镜头只采样中心箭头之外的区域，角度正右为零、顺时针增加。
camera_inner_radius: 18
camera_outer_radius: 65
sector_angle: 90
smooth_degrees: 7
yellow_floor: 5
yellow_ceiling: 80
# 图标屏蔽后扣除红绿偏色；系数由内半径处的0线性增加到外半径处的此值。
# 内圈保留较弱扇区，外圈抑制偏橙背景。设为0可关闭，允许范围0–2。
color_balance_penalty: 0.6
background_percentile: 35
min_contrast: 5
min_concentration: 0.5
min_peak_separation: 0.15
# 三个半径分组分别估计方向；尖窄图标、整圈黄色或分组冲突均拒绝。
min_sector_width: 35
max_sector_width: 145
max_radial_disagreement: 35
min_radial_contrast: 2
# 最外组还须达到内侧最强组的此比例，避免衰减末端的弱背景误触发冲突。
min_outer_radial_contrast_ratio: 0.2
# 外圈角宽还须达到内侧较窄组的一半，排除局部图标的冲突方向。
min_outer_sector_width_ratio: 0.5
# 先排除高亮小图标；触及中心保护区的连通区域和大块背景均保留。
icon_min_yellow_contrast: 90
icon_max_area: 400
